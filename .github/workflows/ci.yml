name: Desktop checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  desktop:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: yo3mfs-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: yo3mfs-macos-x64
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: yo3mfs-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: yo3mfs-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py check
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Install the repository's Rust toolchain
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          toolchain = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']
          command = ['rustup', 'toolchain', 'install', toolchain['channel'], '--profile', toolchain['profile'], '--target', os.environ['BUILD_TARGET']]
          for component in toolchain['components']:
              command += ['--component', component]
          subprocess.run(command, check=True)
          subprocess.run(['rustc', '--version', '--verbose'], check=True)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Packaging regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Clippy
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - name: Desktop and integration tests
        run: cargo test --locked --target ${{ matrix.target }} --all-targets --all-features
      - name: Core tests without GUI
        run: cargo test --locked --target ${{ matrix.target }} --no-default-features
      - name: Release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: CLI smoke test
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          name = 'yo3mfs.exe' if os.name == 'nt' else 'yo3mfs'
          binary = pathlib.Path('target') / os.environ['BUILD_TARGET'] / 'release' / name
          actual = subprocess.check_output([str(binary), '--version'], text=True).strip()
          assert actual == f'yo3mfs {version}', actual
          print(actual)
      - name: macOS DMG
        if: runner.os == 'macOS'
        run: python scripts/package.py --target ${{ matrix.target }} --dmg --output-dir dist/package
      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python scripts/sign_macos.py dist/package
      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: python scripts/sign_macos.py --cleanup
      - name: Windows or Linux portable package
        if: runner.os != 'macOS'
        run: python scripts/package.py --target ${{ matrix.target }} --output-dir dist/package
      - name: Verify package and checksum
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_package.py dist/package
      - name: Verify notarized release package and checksum
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_package.py dist/package --require-notarization
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/package/*.dmg
            dist/package/*.zip
            dist/package/*.tar.gz
            dist/package/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yo3mfs-*
          path: dist/artifacts
      - name: Verify all four packages and combine checksums
        run: python scripts/release.py prepare --artifacts dist/artifacts --output dist/release
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --artifacts dist/artifacts --output dist/release
