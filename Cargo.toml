[package]
name = "yo3mfs"
version = "1.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Offline desktop 3MF viewer"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:bytemuck", "dep:pollster", "dep:winresource"]

[dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
rfd = { version = "0.17.2", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }
glam = "0.34.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
tempfile = "3"

[[bin]]
name = "yo3mfs"
path = "src/main.rs"
required-features = ["desktop"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = { version = "0.1.34", optional = true }

